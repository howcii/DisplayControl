plugins {
    id 'com.android.application' version '8.13.0' apply false
}

def externalBuildRoot = providers.gradleProperty('displayControlAndroidBuildRoot').orNull
if (externalBuildRoot != null && externalBuildRoot.trim().length() > 0) {
    subprojects {
        layout.buildDirectory = file("${externalBuildRoot}/${project.name}")
    }
}
