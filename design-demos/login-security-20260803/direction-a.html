<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fd">
  <title>方案 A · 轻量波浪</title>
  <!--
    假设：保留现有左右分栏和蓝白控制台，只优化验证码辨识强度与会话失效提示。
    本文件是视觉预览，不包含真实认证逻辑；正式验证码不会把答案作为 SVG 文本发送给浏览器。
  -->
  <style>
    :root{--bg:#f5f8fd;--surface:#fff;--soft:#eef5ff;--line:#dbe5f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--red:#c81e1e;--redsoft:#fff3f3;--green:#15803d}
    *{box-sizing:border-box} body{margin:0;min-width:320px;min-height:100vh;color:var(--text);background:linear-gradient(180deg,#fbfdff 0 68%,#eef4fb);font:15px/1.55 "Microsoft YaHei UI","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit} button{cursor:pointer;touch-action:manipulation} button:focus-visible,input:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:2px}
    header{height:76px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)} .head{max-width:1240px;height:100%;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.2)}.mark svg{width:23px;fill:none;stroke:currentColor;stroke-width:1.8}.name{font-size:19px;font-weight:800}.sub{color:var(--muted);font-size:12px}.online{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:700;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
    main{position:relative;min-height:calc(100vh - 76px);display:grid;place-items:center;padding:46px 28px 82px}.layout{width:min(1120px,100%);display:grid;grid-template-columns:1fr 420px;gap:82px;align-items:center}
    .eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.08em}.intro h1{max-width:10ch;margin:14px 0 18px;font-size:48px;line-height:1.16;letter-spacing:-.045em;text-wrap:balance}.intro p{max-width:560px;margin:0;color:var(--muted);font-size:16px}.facts{display:flex;gap:12px;margin-top:28px}.fact{padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.72);color:#334155;font-size:13px}.fact strong{color:var(--text)}
    .card{padding:30px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 22px 58px rgba(30,64,175,.11)}.card h2{margin:0 0 4px;font-size:23px}.card>p{margin:0 0 22px;color:var(--muted);font-size:14px}.stack{display:grid;gap:15px}label{display:grid;gap:7px;color:#334155;font-size:14px;font-weight:700}input{width:100%;height:46px;padding:0 13px;border:1px solid #cbd9ea;border-radius:10px;color:var(--text);background:#fff}input::placeholder{color:#94a3b8}
    .caprow{display:grid;grid-template-columns:1fr 164px;gap:10px}.captcha{height:54px;padding:0;overflow:hidden;border:1px solid #bfd3ec;border-radius:10px;background:#f8fbff}.captcha svg{display:block;width:100%;height:100%}.hint{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:400}.hint span:last-child{color:var(--blue)}
    .error{min-height:22px;color:var(--red);font-size:13px;font-weight:650}.submit{height:48px;border:1px solid var(--blue);border-radius:10px;background:var(--blue);color:#fff;font-weight:800}.submit:hover{background:var(--blue2)}
    .session{position:absolute;right:max(28px,calc((100vw - 1240px)/2 + 28px));bottom:24px;width:402px;padding:14px 16px;border:1px solid #fecaca;border-radius:14px;background:var(--redsoft);box-shadow:0 12px 28px rgba(127,29,29,.10);display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center}.warn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fee2e2;color:var(--red);font-weight:900}.session strong{display:block;color:#991b1b;font-size:14px}.session p{margin:1px 0 0;color:#7f1d1d;font-size:12px}.again{min-height:36px;padding:0 11px;border:1px solid #fca5a5;border-radius:9px;background:#fff;color:#991b1b;font-weight:700}
    .label{position:absolute;left:28px;bottom:28px;color:#64748b;font-size:12px}.label b{color:var(--blue)}
    @media(max-width:850px){.layout{grid-template-columns:1fr;gap:28px}.intro{display:none}.session{position:static;width:min(420px,100%);margin:22px auto 0}.label{display:none}main{display:block}.card{max-width:420px;margin:auto}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><div><div class="name">屏控中心</div><div class="sub">企业展示屏集中控制系统</div></div></div><div class="online"><span class="dot"></span>HTTP 在线</div></div></header>
  <main>
    <div class="layout">
      <section class="intro" aria-labelledby="title-a"><div class="eyebrow">安全访问 · 唯一管理席位</div><h1 id="title-a">集中管理公司的显示设备</h1><p>从一个网页查看真实状态，统一亮屏、休眠或启用黑幕遮罩。新设备登录后，旧设备会自动安全退出。</p><div class="facts"><div class="fact"><strong>单一设备</strong> 同时在线</div><div class="fact"><strong>8 小时</strong> 登录有效期</div></div></section>
      <form class="card" onsubmit="event.preventDefault()" novalidate><h2>管理员登录</h2><p>请输入账号、密码和图形验证码。</p><div class="stack">
        <label for="a-user">用户名<input id="a-user" name="username" autocomplete="username" spellcheck="false" value="admin"></label>
        <label for="a-pass">密码<input id="a-pass" name="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码…"></label>
        <label for="a-code">验证码<div class="caprow"><input id="a-code" name="captcha" autocomplete="off" spellcheck="false" maxlength="5" placeholder="5 位字母或数字…"><button class="captcha" type="button" aria-label="更换验证码">
          <svg viewBox="0 0 164 54" role="img" aria-label="验证码 Q7MKR"><rect x="1" y="1" width="162" height="52" rx="10" fill="#f8fbff" stroke="#bfdbfe"/><g opacity=".25" fill="#60a5fa"><circle cx="20" cy="15" r="1.4"/><circle cx="49" cy="44" r="1.2"/><circle cx="91" cy="10" r="1.1"/><circle cx="142" cy="39" r="1.5"/></g><path d="M5 34 C38 17 69 42 102 24 S144 18 160 29" fill="none" stroke="#64748b" stroke-width="1.2" opacity=".42"/><path d="M7 20 C42 35 76 10 112 31 S146 37 159 23" fill="none" stroke="#3b82f6" stroke-width="1" opacity=".28"/><g font-family="Georgia,Segoe UI,sans-serif" font-size="31" font-weight="800"><text x="14" y="39" fill="#397443" transform="rotate(-7 24 28)">Q</text><text x="44" y="36" fill="#a33a46" transform="rotate(5 53 28)">7</text><text x="70" y="40" fill="#334155" transform="rotate(-4 82 28)">M</text><text x="106" y="36" fill="#2563eb" transform="rotate(7 116 28)">K</text><text x="136" y="39" fill="#6d4abb" transform="rotate(-5 145 28)">R</text></g></svg>
        </button></div><span class="hint"><span>不区分大小写</span><span>点击图片更换</span></span></label>
        <div class="error" aria-live="polite"></div><button class="submit" type="submit">登录屏控中心</button>
      </div></form>
    </div>
    <aside class="session" aria-live="polite"><div class="warn">!</div><div><strong>此账号已在另一台设备登录</strong><p>本设备已安全退出，请确认后重新登录。</p></div><button class="again" type="button">重新登录</button></aside>
    <div class="label"><b>方案 A</b> · 轻量波浪 / 最接近现有页面</div>
  </main>
</body>
</html>
