<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fd">
  <title>方案 B · 安全门禁</title>
  <!-- 假设：把“唯一管理席位”做成登录前就能看懂的门禁规则；本文件只做视觉预览。 -->
  <style>
    :root{--bg:#f5f8fd;--surface:#fff;--soft:#eef5ff;--line:#dbe5f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--red:#b91c1c;--redsoft:#fff4f4;--green:#15803d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font:15px/1.55 "Microsoft YaHei UI","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid rgba(37,99,235,.3);outline-offset:2px}
    .shell{min-height:100vh;display:grid;grid-template-columns:360px 1fr}.rail{position:relative;padding:38px 42px;background:#0f2f66;color:#fff;overflow:hidden}.rail:after{position:absolute;right:-130px;bottom:-160px;width:390px;height:390px;border:70px solid rgba(96,165,250,.12);border-radius:50%;content:""}.brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--blue)}.mark svg{width:24px;fill:none;stroke:currentColor;stroke-width:1.8}.brand b{display:block;font-size:19px}.brand span{color:#c7d9f5;font-size:12px}.railcopy{position:relative;z-index:1;margin-top:140px}.kicker{color:#93c5fd;font-size:13px;font-weight:800;letter-spacing:.08em}.rail h1{max-width:8ch;margin:14px 0 18px;font-size:42px;line-height:1.2;letter-spacing:-.035em}.rail p{margin:0;color:#d7e5f9;font-size:15px}.rules{position:relative;z-index:1;margin:38px 0 0;padding:0;list-style:none;display:grid;gap:18px}.rules li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;color:#e8f1ff;font-size:14px}.num{width:26px;height:26px;border:1px solid rgba(255,255,255,.28);border-radius:50%;display:grid;place-items:center;color:#bfdbfe;font-size:12px;font-weight:800}
    .main{display:grid;grid-template-rows:76px 1fr;background:linear-gradient(145deg,#fbfdff,#eef4fb)}header{padding:0 42px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--green);font-size:13px;font-weight:750}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.stage{display:grid;place-items:center;padding:42px}.card{width:486px;padding:30px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(30,64,175,.1)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.top h2{margin:0 0 4px;font-size:24px}.top p{margin:0;color:var(--muted);font-size:13px}.badge{padding:6px 9px;border-radius:999px;background:#eff6ff;color:var(--blue);font-size:12px;font-weight:750;white-space:nowrap}
    .replaced{margin-bottom:18px;padding:12px 14px;border:1px solid #fecaca;border-radius:11px;background:var(--redsoft);display:grid;grid-template-columns:24px 1fr;gap:10px}.replaced .i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fee2e2;color:var(--red);font-weight:900}.replaced strong{display:block;color:#991b1b;font-size:13px}.replaced span{display:block;margin-top:2px;color:#7f1d1d;font-size:12px}
    .stack{display:grid;gap:15px}label{display:grid;gap:7px;color:#334155;font-size:14px;font-weight:700}input{height:46px;width:100%;padding:0 13px;border:1px solid #cbd9ea;border-radius:9px;color:var(--text);background:#fff}input::placeholder{color:#94a3b8}.capwrap{display:grid;grid-template-columns:1fr 176px;gap:10px}.captcha{height:54px;padding:0;overflow:hidden;border:1px solid #c7d9ee;border-radius:9px;background:#fbfdff}.captcha svg{display:block;width:100%;height:100%}.under{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:400}.under span:last-child{color:var(--blue)}.error{min-height:18px;color:var(--red);font-size:12px}.submit{height:48px;border:1px solid var(--blue);border-radius:9px;background:var(--blue);color:#fff;font-weight:800}.submit:hover{background:var(--blue2)}.foot{margin:16px 0 0;text-align:center;color:var(--muted);font-size:12px}.foot strong{color:#334155}
    .label{position:fixed;right:28px;bottom:24px;color:#64748b;font-size:12px}.label b{color:var(--blue)}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.rail{display:none}.stage{padding:24px}.card{width:min(486px,100%)}.label{display:none}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><div><b>屏控中心</b><span>企业展示屏集中控制系统</span></div></div><div class="railcopy"><div class="kicker">唯一管理席位</div><h1>一次只由一台设备管理</h1><p>避免多人同时发送相反命令，让现场控制保持清楚、可追踪。</p></div><ol class="rules"><li><span class="num">1</span><span>新设备登录成功后，自动替换之前的管理设备。</span></li><li><span class="num">2</span><span>旧设备收到清晰提示，并停止继续发送控制命令。</span></li><li><span class="num">3</span><span>重新登录即可接管，不依赖固定 IP 地址。</span></li></ol></aside>
    <section class="main"><header><span class="dot"></span>服务器在线 · 安全连接</header><div class="stage">
      <form class="card" onsubmit="event.preventDefault()" novalidate><div class="top"><div><h2>管理员登录</h2><p>验证身份后进入设备控制台</p></div><span class="badge">仅限 1 台设备</span></div>
        <div class="replaced" aria-live="polite"><span class="i">!</span><div><strong>本设备的管理席位已被替换</strong><span>账号已在另一台设备登录，请确认后重新登录。</span></div></div>
        <div class="stack"><label for="b-user">用户名<input id="b-user" name="username" autocomplete="username" spellcheck="false" value="admin"></label><label for="b-pass">密码<input id="b-pass" name="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码…"></label>
          <label for="b-code">验证码<div class="capwrap"><input id="b-code" name="captcha" autocomplete="off" spellcheck="false" maxlength="5" placeholder="输入 5 位验证码…"><button class="captcha" type="button" aria-label="更换验证码"><svg viewBox="0 0 176 54" role="img" aria-label="验证码 H4P9X"><rect x="1" y="1" width="174" height="52" rx="9" fill="#f8fbff" stroke="#bfdbfe"/><g opacity=".18" stroke="#64748b"><path d="M15 8v38M61 5v41M118 8v38M158 6v41"/><path d="M6 14h164M6 41h164"/></g><path d="M4 33 C38 10 74 41 107 23 S147 17 172 30" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity=".35"/><g font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="800"><text x="15" y="38" fill="#3f6f45" transform="skewX(-7)">H</text><text x="52" y="35" fill="#b13b48" transform="rotate(5 62 27)">4</text><text x="82" y="39" fill="#334155" transform="skewX(6)">P</text><text x="116" y="35" fill="#2563eb" transform="rotate(-5 126 27)">9</text><text x="146" y="39" fill="#7251a8" transform="skewX(-5)">X</text></g><g opacity=".28" stroke="#fff" stroke-width="2"><path d="M12 29h28"/><path d="M79 25h27"/><path d="M143 31h26"/></g></svg></button></div><span class="under"><span>字母不区分大小写</span><span>看不清？换一张</span></span></label>
          <div class="error" aria-live="polite"></div><button class="submit" type="submit">重新登录并接管</button>
        </div><p class="foot">登录即表示接管当前唯一的<strong>管理席位</strong></p>
      </form>
    </div></section>
  </div><div class="label"><b>方案 B</b> · 安全门禁 / 规则最清楚</div>
</body>
</html>
