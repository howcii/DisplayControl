<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fd">
  <title>方案 C · 会话控制台</title>
  <!-- 假设：让管理员明确看到“当前控制席位”的状态；本文件只做登录安全预览。 -->
  <style>
    :root{--bg:#f5f8fd;--surface:#fff;--soft:#eef5ff;--line:#dbe5f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#1d4ed8;--red:#c81e1e;--green:#15803d;--amber:#a16207}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:#f5f8fd;font:15px/1.55 "Microsoft YaHei UI","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid rgba(37,99,235,.3);outline-offset:2px}
    header{height:78px;border-bottom:1px solid var(--line);background:#fff}.head{max-width:1220px;height:100%;margin:auto;padding:0 26px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blue);color:#fff}.mark svg{width:23px;fill:none;stroke:currentColor;stroke-width:1.8}.brand b{display:block;font-size:19px}.brand small{display:block;color:var(--muted);font-size:12px}.secure{padding:7px 11px;border-radius:999px;background:#f0fdf4;color:var(--green);font-size:12px;font-weight:750}.secure:before{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:currentColor;content:""}
    main{min-height:calc(100vh - 78px);padding:52px 28px;background:radial-gradient(circle at 50% 26%,rgba(37,99,235,.08),transparent 38%),linear-gradient(#fbfdff,#eef4fb)}.heading{max-width:980px;margin:0 auto 26px}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.08em}.heading h1{margin:8px 0 5px;font-size:34px;line-height:1.25;letter-spacing:-.03em}.heading p{margin:0;color:var(--muted)}
    .workspace{width:min(980px,100%);margin:auto;display:grid;grid-template-columns:580px 1fr;gap:18px;align-items:stretch}.panel{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 14px 40px rgba(30,64,175,.08)}.login{padding:28px}.login h2{margin:0 0 4px;font-size:22px}.login>p{margin:0 0 21px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}label{display:grid;gap:7px;color:#334155;font-size:14px;font-weight:700}input{height:46px;width:100%;padding:0 13px;border:1px solid #cbd9ea;border-radius:10px;background:#fff;color:var(--text)}input::placeholder{color:#94a3b8}.caprow{display:grid;grid-template-columns:1fr 184px;gap:10px}.captcha{height:56px;padding:0;overflow:hidden;border:1px solid #bfd3ec;border-radius:10px;background:#f9fbff}.captcha svg{display:block;width:100%;height:100%}.capnote{display:flex;justify-content:space-between;margin-top:5px;color:var(--muted);font-size:12px;font-weight:400}.capnote span:last-child{color:var(--blue)}.error{min-height:18px;color:var(--red);font-size:12px}.submit{height:48px;border:1px solid var(--blue);border-radius:10px;background:var(--blue);color:#fff;font-weight:800}.submit:hover{background:var(--blue2)}
    .session{display:flex;flex-direction:column;padding:24px}.session h2{margin:0 0 16px;font-size:18px}.seat{padding:16px;border:1px solid #fed7aa;border-radius:13px;background:#fffaf0}.seathead{display:flex;align-items:center;justify-content:space-between;gap:8px}.seathead strong{font-size:14px}.pill{padding:5px 8px;border-radius:999px;background:#fff7ed;color:var(--amber);font-size:11px;font-weight:800}.device{margin:14px 0 0;display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:12px}.row b{max-width:170px;color:#334155;text-align:right;font-weight:650}.rule{margin:18px 0 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:#475569;font-size:12px}.rule strong{display:block;margin-bottom:4px;color:var(--text);font-size:13px}.replace{margin-top:auto;padding-top:22px}.replacebox{padding:14px;border:1px solid #fecaca;border-radius:12px;background:#fff4f4;color:#7f1d1d}.replacebox strong{display:block;color:#991b1b;font-size:13px}.replacebox p{margin:4px 0 12px;font-size:12px}.replacebox button{width:100%;height:38px;border:1px solid #fca5a5;border-radius:9px;background:#fff;color:#991b1b;font-weight:750}
    .label{width:min(980px,100%);margin:18px auto 0;color:#64748b;font-size:12px}.label b{color:var(--blue)}
    @media(max-width:900px){.workspace{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.session{min-height:340px}.heading{max-width:580px}.label{max-width:580px}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><div><b>屏控中心</b><small>企业展示屏集中控制系统</small></div></div><span class="secure">服务器在线 · 会话保护已启用</span></div></header>
  <main><div class="heading"><div class="eyebrow">安全访问</div><h1>接管显示设备管理席位</h1><p>系统同时只保留一个管理员会话，新登录会自动替换旧设备。</p></div>
    <div class="workspace">
      <form class="panel login" onsubmit="event.preventDefault()" novalidate><h2>管理员登录</h2><p>输入凭据后进入控制台，验证码不区分大小写。</p><div class="grid">
        <label for="c-user">用户名<input id="c-user" name="username" autocomplete="username" spellcheck="false" value="admin"></label><label for="c-pass">密码<input id="c-pass" name="password" type="password" autocomplete="current-password" placeholder="管理员密码…"></label>
        <label class="full" for="c-code">图形验证码<div class="caprow"><input id="c-code" name="captcha" autocomplete="off" spellcheck="false" maxlength="5" placeholder="输入 5 位字母或数字…"><button class="captcha" type="button" aria-label="更换验证码"><svg viewBox="0 0 184 56" role="img" aria-label="验证码 W8T2N"><rect x="1" y="1" width="182" height="54" rx="10" fill="#f8fbff" stroke="#bfdbfe"/><g fill="#60a5fa" opacity=".17"><circle cx="18" cy="40" r="1.4"/><circle cx="47" cy="12" r="1.2"/><circle cx="83" cy="45" r="1.5"/><circle cx="122" cy="11" r="1.2"/><circle cx="165" cy="40" r="1.4"/></g><path d="M4 37 Q39 13 74 31 T145 28 T181 24" fill="none" stroke="#3b82f6" stroke-width="1.35" opacity=".38"/><path d="M5 19 Q38 38 71 20 T138 23 T180 34" fill="none" stroke="#64748b" stroke-width="1" opacity=".28"/><g font-family="Georgia,Segoe UI,sans-serif" font-size="32" font-weight="800"><text x="15" y="40" fill="#3d7048" transform="rotate(-8 29 28) skewX(-5)">W</text><text x="57" y="36" fill="#b03a48" transform="rotate(6 66 28) scale(1 .96)">8</text><text x="88" y="40" fill="#334155" transform="rotate(-4 98 28) skewX(5)">T</text><text x="120" y="36" fill="#2563eb" transform="rotate(7 130 28)">2</text><text x="151" y="40" fill="#6f4ea1" transform="rotate(-5 162 28) skewX(-4)">N</text></g></svg></button></div><span class="capnote"><span>轻微透视与弧线干扰</span><span>点击图片更换</span></span></label>
        <div class="error full" aria-live="polite"></div><button class="submit full" type="submit">登录并接管管理席位</button>
      </div></form>
      <aside class="panel session"><h2>管理席位状态</h2><div class="seat"><div class="seathead"><strong>当前会话</strong><span class="pill">已被替换</span></div><div class="device"><div class="row"><span>设备</span><b>办公室笔记本</b></div><div class="row"><span>浏览器</span><b>Chrome · Windows</b></div><div class="row"><span>状态</span><b>已安全退出</b></div></div></div><div class="rule"><strong>单设备登录规则</strong>另一台设备成功登录后，本设备停止控制并要求重新验证。</div><div class="replace"><div class="replacebox" aria-live="polite"><strong>此账号已在另一台设备登录</strong><p>如需在本设备继续管理，请重新登录并接管席位。</p><button type="button">重新登录</button></div></div></aside>
    </div><div class="label"><b>方案 C</b> · 会话控制台 / 状态解释最完整</div>
  </main>
</body>
</html>
