plugins {
    id 'com.android.application'
}

android {
    namespace 'com.displaycontrol.serialprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.displaycontrol.serialprobe'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}
